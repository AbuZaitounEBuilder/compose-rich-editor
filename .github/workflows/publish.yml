name: Publish to GitHub Packages

on:
  push:
    branches:
      - 'fix/clamping-offset-mapping-rc14'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Publish to GitHub Packages
        run: ./gradlew :richeditor-compose:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

